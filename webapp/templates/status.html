<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BrewSys Status</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>BrewSys Main Status</h1>
    <div class="status-section" style="max-width:800px; margin: 0 auto;">
        <h2></h2>
    <div style="display: flex; gap: 32px; margin-bottom: 16px; max-width: 600px; margin-left: auto; margin-right: auto;">
            <div style="display: flex; flex-direction: column; align-items: center;">
                <span style="font-size: 24px; font-weight: bold; margin-bottom: 8px;">HLT</span>
                <div style="border: 2px solid #888; border-radius: 8px; padding: 16px 32px; background: #f8f8f8; min-width: 100px; text-align: center;">
                    <span id="hlt_temp" style="font-size: 24px; font-weight: bold;">{{ hlt_temp }} &deg;C</span>
                </div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center;">
                <span style="font-size: 24px; font-weight: bold; margin-bottom: 8px;">MLT In</span>
                <div style="border: 2px solid #888; border-radius: 8px; padding: 16px 32px; background: #f8f8f8; min-width: 100px; text-align: center;">
                    <span id="mt_in_temp" style="font-size: 24px; font-weight: bold;">{{ mt_in_temp }} &deg;C</span>
                </div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center;">
                <span style="font-size: 24px; font-weight: bold; margin-bottom: 8px;">MLT</span>
                <div style="border: 2px solid #888; border-radius: 8px; padding: 16px 32px; background: #f8f8f8; min-width: 100px; text-align: center;">
                    <span id="mt_out_temp" style="font-size: 24px; font-weight: bold;">{{ mt_out_temp }} &deg;C</span>
                </div>
            </div>
        </div>
        <h2>System State</h2>
        <p>Current State: <strong id="current_state">{{ current_state }}</strong></p>
        <h2>Elements</h2>
    <ul style="list-style: none; padding: 0; text-align: left;">
            <li style="margin-bottom: 8px;">
                <button id="btn_hlt_heater" onclick="toggleElement('hlt_heater')" style="min-width: 180px; font-weight: bold; color: white; border: none; border-radius: 5px; padding: 8px 16px;">
                    HLT Heater: --
                </button>
            </li>
            <li style="margin-bottom: 8px;">
                <button id="btn_hlt_pump" onclick="toggleElement('hlt_pump')" style="min-width: 180px; font-weight: bold; color: white; border: none; border-radius: 5px; padding: 8px 16px;">
                    HLT Pump: --
                </button>
            </li>
            <li style="margin-bottom: 8px;">
                <button id="btn_mlt_pump" onclick="toggleElement('mt_pump')" style="min-width: 180px; font-weight: bold; color: white; border: none; border-radius: 5px; padding: 8px 16px;">
                    MT Pump: --
                </button>
            </li>
        </ul>
        <h2>Time Left</h2>
        <p id="time_left">{{ time_left }}</p>
        <button>Proceed</button>
    <div id="sim-indicator" style="color: orange; font-weight: bold; display: none; margin-top: 16px; text-align: center;">Simulation Mode Active</div>
    <div id="hardware-error" style="color: red; font-weight: bold; display: none; margin-top: 8px; text-align: center;"></div>
    </div>
    <script>
    let lastStatus = {};
    function updateStatus() {
        fetch('/api/status')
            .then(response => response.json())
            .then(data => {
                lastStatus = data;
                document.getElementById('hlt_temp').innerHTML = `${data.hlt_temp} &deg;C`;
                // Show/hide simulation mode indicator
                document.getElementById('sim-indicator').style.display = data.sim_mode ? 'block' : 'none';
                if (data.sim_mode && data.hardware_error) {
                    document.getElementById('hardware-error').style.display = 'block';
                    document.getElementById('hardware-error').textContent = data.hardware_error;
                } else {
                    document.getElementById('hardware-error').style.display = 'none';
                    document.getElementById('hardware-error').textContent = '';
                }
                document.getElementById('mt_in_temp').innerHTML = `${data.mt_in_temp} &deg;C`;
                document.getElementById('mt_out_temp').innerHTML = `${data.mt_out_temp} &deg;C`;
                document.getElementById('current_state').textContent = data.current_state;
                document.getElementById('btn_hlt_heater').style.backgroundColor = data.hlt_heater === 'ON' ? 'green' : 'red';
                document.getElementById('btn_hlt_heater').textContent = `HLT Heater: ${data.hlt_heater}`;
                document.getElementById('btn_hlt_pump').style.backgroundColor = data.hlt_pump === 'ON' ? 'green' : 'red';
                document.getElementById('btn_hlt_pump').textContent = `HLT Pump: ${data.hlt_pump}`;
                document.getElementById('btn_mlt_pump').style.backgroundColor = data.mt_pump === 'ON' ? 'green' : 'red';
                document.getElementById('btn_mlt_pump').textContent = `MLT Pump: ${data.mt_pump}`;
                // Enable/disable buttons based on FSM state
                document.getElementById('btn_hlt_heater').disabled = !data.can_override_heater;
                document.getElementById('btn_hlt_pump').disabled = !data.can_override_hlt_pump;
                document.getElementById('btn_mlt_pump').disabled = !data.can_override_mlt_pump;
                document.getElementById('time_left').textContent = data.time_left;
            });
    }
    function toggleElement(element) {
        if (!lastStatus) return;
        let payload = {};
        if (element === 'hlt_heater') {
            payload.hlt_heater = lastStatus.hlt_heater === 'OFF';
        } else if (element === 'hlt_pump') {
            payload.hlt_pump = lastStatus.hlt_pump === 'OFF';
        } else if (element === 'mt_pump') {
            payload.mt_pump = lastStatus.mt_pump === 'OFF';
        }
        fetch('/api/control', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => setTimeout(updateStatus, 200));
    }
    setInterval(updateStatus, 3000); // Refresh every 3 seconds
    </script>
</body>
</html>
